spring:
  application:
    name: Veterinary

  datasource:
    url: ${BD_URL:jdbc:mysql://localhost:3306/veterinary}
    username: ${BD_USER:root}
    password: ${BD_PASS:password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

jwt:
  secret: ${JWT_SECRET:miClaveSecretaParaDesarrolloDebeSerMuyLargaYSegura123456789}
  expiration: ${JWT_EXPIRATION:3600000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:86400000}

admin:
  username: ${ADMIN_USERNAME:admin}
  password: ${ADMIN_PASSWORD:admin123}
  email: ${ADMIN_EMAIL:admin@veterinary.com}